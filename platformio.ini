; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; https://docs.platformio.org/en/latest/boards/espressif32/dfrobot_firebeetle2_esp32e.html

[platformio]
default_envs = dfrobot_firebeetle2_esp32e_debug

[env]
; pioarduino adds support for ESP32-C6 through Arduino Core 3.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
extra_scripts =
	pre:scripts/pre_build_fonts.py
	post:scripts/post_build_check_rtc.py
lib_deps =
	adafruit/Adafruit NeoPixel
	milesburton/DallasTemperature
	OneWire=https://github.com/PaulStoffregen/OneWire.git#master ; adds support for ESP32-C6 after 2.3.8 release (no release since)
	GxEPD2=https://github.com/antoinecellerier/GxEPD2.git#add-gdeh0576t81-support
	HULP=https://github.com/antoinecellerier/HULP.git#arduino-core-3x-compat
upload_protocol = esptool
;upload_port = /dev/ttyUSB0
;monitor_port = /dev/ttyUSB0
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
debug_tool = esp-prog
debug_init_break = tbreak setup

[env:debug]
build_flags = -DSLEEP_INTERVAL_S=5
;build_flags = -DPPK2_DEBUG -DSLEEP_INTERVAL_S=5
; looks like setting build_type here doesn't work unfortunately, so set it in the individual envs below

[env:release]
build_flags = -DDISABLE_SERIAL


[env:dfrobot_firebeetle2_esp32e]

[env:dfrobot_firebeetle2_esp32e_debug]
board = dfrobot_firebeetle2_esp32e
build_type = debug
extends = dfrobot_firebeetle2_esp32e, debug
; build_flags from [env:debug] don't inherit via extends — must set explicitly
; Uncomment to fill display with mock data on first boot for layout testing:
build_flags = ${env:debug.build_flags}
;build_flags = ${env:debug.build_flags} -DMOCK_DISPLAY_DATA

[env:dfrobot_firebeetle2_esp32e_release]
board = dfrobot_firebeetle2_esp32e
build_type = release
extends = dfrobot_firebeetle2_esp32e, release
; build_flags from [env:release] don't inherit via extends — must set explicitly
; (without this, DISABLE_SERIAL is dropped: serial stays on and the "DEBUG"
; indicator shows because power_efficient is gated on DISABLE_SERIAL)
build_flags = ${env:release.build_flags}


; C6 builds pure ESP-IDF on the stock platform: LP core ULP is native
; (ulp_embed_binary in src/CMakeLists.txt + sdkconfig.defaults.esp32c6).
; DISABLE_DISPLAY is temporary until the GxEPD2 stack is vendored as IDF
; components (migration stage D); the board macro is injected here because
; there is no Arduino variant to define it.
[env:seeed_xiao_esp32c6]
framework = espidf
board = seeed_xiao_esp32c6
lib_deps =
build_flags = -DARDUINO_XIAO_ESP32C6 -DDISABLE_DISPLAY

[env:seeed_xiao_esp32c6_debug]
extends = seeed_xiao_esp32c6, debug
framework = espidf
board = seeed_xiao_esp32c6
lib_deps =
build_flags = ${env:debug.build_flags} ${env:seeed_xiao_esp32c6.build_flags}
build_type = debug

[env:seeed_xiao_esp32c6_release]
extends = seeed_xiao_esp32c6, release
framework = espidf
board = seeed_xiao_esp32c6
lib_deps =
build_flags = ${env:release.build_flags} ${env:seeed_xiao_esp32c6.build_flags}
build_type = release
