; PlatformIO Project Configuration File
;
; Pure ESP-IDF on the official espressif32 platform for both boards. The project
; is a standard IDF CMake tree — `idf.py -DIDF_TARGET=<t> build` works too
; (board macros derive from IDF_TARGET in src/CMakeLists.txt); PlatformIO adds
; env profiles, monitor filters, and the font/GIT_HASH + RTC-check scripts.
; - Arduino-only display libs (GxEPD2, Adafruit GFX) are vendored under
;   components/ behind components/arduino_shim; no lib_deps remain.
; - sdkconfig: sdkconfig.defaults + sdkconfig.defaults.<target> (tracked).
; - custom_rig names the wired hardware (panel, sensor, power gate, LEDs) from
;   include/rigs/. Every env declares one, so `pio run -e <env>` needs nothing
;   else; RIG=<name> overrides. See include/rigs/_template.h.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = dfrobot_firebeetle2_esp32e_debug

[env]
platform = espressif32 @ ^7.0.1
framework = espidf
extra_scripts =
	pre:scripts/pre_build.py
	post:scripts/post_build_check_rtc.py
	post:scripts/check_ulp_size.py
upload_protocol = esptool
;upload_port = /dev/ttyUSB0
;monitor_port = /dev/ttyUSB0
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
debug_tool = esp-prog
debug_init_break = tbreak setup

; Base sections (no env: prefix): not buildable targets, only for extends.
; Keep it that way — an [env:...] mixin becomes a half-configured build target,
; and extends only inherits reliably from plain sections.

[debug]
build_type = debug
build_flags = -DSLEEP_INTERVAL_S=5
;build_flags = -DPPK2_DEBUG -DSLEEP_INTERVAL_S=5

[release]
; DISABLE_SERIAL must reach every release env: without it serial stays on and
; the "DEBUG" indicator shows (power_efficient is gated on DISABLE_SERIAL)
build_type = release
build_flags = -DDISABLE_SERIAL

[dfrobot_firebeetle2_esp32e]
board = dfrobot_firebeetle2_esp32e
; Flash stays at the board default DIO/40MHz: QIO/80MHz was measured WORSE once
; deep-sleep wakes skip image validation (active phase 22.5 -> 25.2mC — only
; ~13ms faster but ~4mA higher draw across the window). See docs/notes.md.

[seeed_xiao_esp32c6]
board = seeed_xiao_esp32c6


[env:dfrobot_firebeetle2_esp32e_debug]
extends = dfrobot_firebeetle2_esp32e, debug
custom_rig = firebeetle
; Uncomment to fill display with mock data on first boot for layout testing:
;build_flags = ${debug.build_flags} -DMOCK_DISPLAY_DATA

[env:dfrobot_firebeetle2_esp32e_release]
extends = dfrobot_firebeetle2_esp32e, release
custom_rig = firebeetle

[env:seeed_xiao_esp32c6_debug]
extends = seeed_xiao_esp32c6, debug
custom_rig = xiao-bigscreen

[env:seeed_xiao_esp32c6_release]
extends = seeed_xiao_esp32c6, release
custom_rig = xiao-bigscreen


; Seeed ePaper Driver Board for XIAO instead of DESPI-C02: the shield hardwires
; RST=D0, CS=D1, BUSY=D2, DC=D3 and has no panel power gate (pin mapping and
; EPD_POWER_GATE override live in src/Display.cpp behind SEEED_XIAO_EPD_BOARD).
[env:seeed_xiao_esp32c6_epaper_debug]
extends = seeed_xiao_esp32c6, debug
custom_rig = xiao-hat
build_flags = ${debug.build_flags} -DSEEED_XIAO_EPD_BOARD

[env:seeed_xiao_esp32c6_epaper_release]
extends = seeed_xiao_esp32c6, release
custom_rig = xiao-hat
build_flags = ${release.build_flags} -DSEEED_XIAO_EPD_BOARD


; Custom thermometer-c6 board (hardware/thermometer-c6, rev A): same
; ESP32-C6-MINI-1 module as the XIAO, so it reuses that PlatformIO board def.
; Pin map / battery / VBUS handling live behind THERMOMETER_C6_BOARD (EPD on
; GPIO18-23, gate GPIO14, divider GPIO2/3, VBUS sense GPIO4). The extra
; sdkconfig defaults select the on-board FC-135 32.768kHz RTC crystal; pass
; the same -DSDKCONFIG_DEFAULTS to idf.py for non-PlatformIO builds.
; The rig header supplies EPD_POWER_GATE (enforced), the panel and the sensor.
[thermometer_c6]
board = seeed_xiao_esp32c6
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.thermometer_c6"

[env:thermometer_c6_debug]
extends = thermometer_c6, debug
custom_rig = revA-bigscreen
build_flags = ${debug.build_flags} -DTHERMOMETER_C6_BOARD

[env:thermometer_c6_release]
extends = thermometer_c6, release
custom_rig = revA-bigscreen
build_flags = ${release.build_flags} -DTHERMOMETER_C6_BOARD

; Bench-only BOD probe for the 3V3-sag-at-refresh check: thermometer_c6_debug
; plus sdkconfig.defaults.bod_probe, which raises the brownout level to its
; ~3.27V top setting so a refresh-peak dip on 3V3 becomes a BROWN reset the
; PPK2 sweep classifier sees as a non-HEALTHY step. Never deploy this env — at
; low battery it bootloops where release shuts down. ROM download mode ignores
; the raised level, so USB reflash always recovers a bootlooping board.
[env:thermometer_c6_bod_probe]
extends = thermometer_c6, debug
custom_rig = revA-bigscreen
build_flags = ${debug.build_flags} -DTHERMOMETER_C6_BOARD
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.thermometer_c6;sdkconfig.defaults.bod_probe"
